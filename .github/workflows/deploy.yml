name: Deploy dashboard to GitHub Pages

# Builds the site with fresh data from Airtable and OpenWeatherMap and publishes it.
# The keys live in the repo's Actions secrets and are only visible to this job.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'   # every hour, so Airtable edits and the weather stay fresh
  workflow_dispatch:       # "Run workflow" button for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site from Airtable + OpenWeatherMap
        run: node scripts/build-site.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
